name: Update Nix Packages

on:
  schedule:
    - cron: "37 18 * * *" # daily 18:37 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Install nix-update
        run: nix profile install nixpkgs#nix-update

      - name: Update, build, and open PR
        env:
          NIXPKGS_ALLOW_UNFREE: "1"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IGNORE=$(yq -o=json '.packages.ignore // []' cache.yml)

          versions() {
            nix eval --json --impure --expr '
              builtins.mapAttrs (_: v: if v ? version then v.version else "?")
                (builtins.getFlake (toString ./.)).packages.x86_64-linux
            ' 2>/dev/null || echo "{}"
          }

          BEFORE=$(versions)

          UPDATED=""
          FAILED=""
          for nixfile in nix/packages/*.nix; do
            pkg=$(basename "$nixfile" .nix)
            if jq -e --arg p "$pkg" 'index($p) != null' <<< "$IGNORE" >/dev/null 2>&1; then
              echo "::notice::skipping $pkg (cache.yml packages.ignore)"
              continue
            fi
            if nix-update "$pkg" --flake; then
              UPDATED="$UPDATED $pkg"
            else
              FAILED="$FAILED $pkg"
            fi
          done

          BROKEN=""
          for pkg in $UPDATED; do
            echo "::group::Building $pkg"
            if nix build ".#packages.x86_64-linux.$pkg" \
              --print-build-logs --impure --accept-flake-config; then
              echo "::notice::build ok: $pkg"
            else
              echo "::warning::build failed, reverting $pkg"
              git checkout -- "nix/packages/$pkg.nix"
              BROKEN="$BROKEN $pkg"
            fi
            echo "::endgroup::"
          done

          VERSIONS="[]"
          EXTRAS=""
          AFTER=$(versions)
          for pkg in $UPDATED; do
            if [[ " $BROKEN " == *" $pkg "* ]]; then
              continue
            fi
            old=$(jq -r --arg p "$pkg" '.[$p] // "?"' <<< "$BEFORE")
            new=$(jq -r --arg p "$pkg" '.[$p] // "?"' <<< "$AFTER")
            if [ "$old" = "$new" ]; then
              EXTRAS="$EXTRAS $pkg"
            else
              VERSIONS=$(jq -c --arg p "$pkg" --arg o "$old" --arg n "$new" \
                '. + [{pkg: $p, old: $o, new: $n}]' <<< "$VERSIONS")
            fi
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          if git diff --cached --quiet; then
            echo "No changes — stopping"
            exit 0
          fi

          FILES=$(git diff --cached --name-only | tr '\n' ' ' | sed 's/ *$//')
          N=$(jq 'length' <<< "$VERSIONS")
          [ "$N" -eq 0 ] && SUBJECT="chore: update nix packages" \
                         || SUBJECT="chore: update $N packages"
          {
            echo "$SUBJECT"
            echo ""
            jq -r '.[] | "\(.pkg): \(.old) -> \(.new)"' <<< "$VERSIONS"
          } > /tmp/commit-msg
          git commit --file /tmp/commit-msg

          BRANCH="auto-update/${{ github.run_id }}-${{ github.run_attempt }}"
          git push --force origin "HEAD:refs/heads/$BRANCH"

          {
            echo "## Nix packages update"
            echo ""
            echo "### Updated"
            echo ""
            echo "| Package | Old | New |"
            echo "|---|---|---|"
            if [ "$VERSIONS" = "[]" ]; then
              echo "| _none_ | — | — |"
            else
              echo "$VERSIONS" | jq -r '.[] | "| `\(.pkg)` | `\(.old)` | `\(.new)` |"'
            fi
            if [ -n "$FAILED" ]; then
              echo ""
              echo "**nix-update failed (skipped):**$FAILED"
            fi
            if [ -n "$BROKEN" ]; then
              echo ""
              echo "**Build failed:**$BROKEN"
            fi
            if [ -n "$EXTRAS" ]; then
              echo ""
              echo "_Touched by nix-update but version unchanged (lock-only/rehash):$EXTRAS_"
            fi
            echo ""
            echo "### Changed files"
            echo ""
            for f in $FILES; do
              echo "- \`$f\`"
            done
            echo ""
          } > /tmp/pr-body.md

          gh pr create -R "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
            --title "chore: auto-update nix packages" --body-file /tmp/pr-body.md
